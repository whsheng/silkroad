<svg width="1600" height="2100" viewBox="0 0 1600 2100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="2100" fill="#F6F0E6"/>
  <rect x="38" y="38" width="1524" height="2024" rx="32" fill="#FCFAF6" stroke="#D9CDB7" stroke-width="4"/>

  <text x="92" y="110" fill="#6B4F2A" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">Silkroads Trade 首页定位示意</text>
  <text x="92" y="146" fill="#7E6B52" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16">目标：不改整体视觉风格，只让首次访客更容易理解“这是一个给中国出海团队使用的资源导航与决策入口”。</text>

  <rect x="88" y="188" width="1424" height="54" rx="16" fill="#FFF7E8" stroke="#E4C58A" stroke-width="2"/>
  <text x="118" y="222" fill="#845E1C" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700">核心改动思路：首屏先讲清“服务谁 + 怎么进入”，内容分区继续保留，但每个入口都要有使用场景说明。</text>

  <rect x="88" y="286" width="1424" height="372" rx="28" fill="#FFFDFC" stroke="#D8CCBA" stroke-width="3"/>
  <text x="124" y="344" fill="#9E6B1E" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700">首屏 Hero</text>
  <text x="124" y="404" fill="#1E1B16" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="44" font-weight="700">帮助中国出海团队更快找到平台、工具与服务商</text>
  <text x="124" y="456" fill="#62584A" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23">围绕跨境电商、独立站、物流、支付、合规与增长场景，按问题、市场、平台和方法四种方式进入。</text>

  <rect x="124" y="500" width="226" height="58" rx="29" fill="#1C1A16"/>
  <text x="170" y="537" fill="#FCFAF6" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700">从分类开始</text>
  <rect x="368" y="500" width="226" height="58" rx="29" fill="#F6F1E8" stroke="#D6C6AE" stroke-width="2"/>
  <text x="418" y="537" fill="#2A241B" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700">查看专题</text>

  <rect x="764" y="330" width="700" height="278" rx="24" fill="#FAF5ED" stroke="#D8CCBA" stroke-width="2"/>
  <text x="804" y="382" fill="#6D5330" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700">这里要让用户 5 秒内明白：</text>
  <text x="804" y="426" fill="#42382D" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">1. 这是给中国出海团队用的</text>
  <text x="804" y="462" fill="#42382D" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">2. 不是单纯资讯站，而是资源导航 + 决策入口</text>
  <text x="804" y="498" fill="#42382D" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">3. 有四种进入方式，不同用户可以按自己的问题起步</text>
  <text x="804" y="548" fill="#7E6B52" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">这样用户不会把下面的“分类 / 市场 / 平台 / 专题”看成四块平行但意义模糊的栏目。</text>

  <rect x="88" y="706" width="1424" height="274" rx="28" fill="#FFFDFC" stroke="#D8CCBA" stroke-width="3"/>
  <text x="124" y="764" fill="#9E6B1E" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700">四种进入方式</text>
  <text x="124" y="810" fill="#1E1B16" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700">你可以从这 4 种方式进入</text>
  <text x="124" y="848" fill="#62584A" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20">这部分是当前首页最缺的解释层，用来替用户回答“我应该点哪里”。</text>

  <rect x="124" y="882" width="320" height="64" rx="16" fill="#F4EEE4" stroke="#D7C7B0" stroke-width="2"/>
  <text x="152" y="920" fill="#1E1B16" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700">按问题进入</text>
  <text x="152" y="947" fill="#6A5D4D" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16">我需要物流、支付、建站、AI、合规等资源</text>

  <rect x="468" y="882" width="320" height="64" rx="16" fill="#F4EEE4" stroke="#D7C7B0" stroke-width="2"/>
  <text x="496" y="920" fill="#1E1B16" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700">按市场进入</text>
  <text x="496" y="947" fill="#6A5D4D" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16">我做美国、欧洲、英国、东南亚，想看区域差异</text>

  <rect x="812" y="882" width="320" height="64" rx="16" fill="#F4EEE4" stroke="#D7C7B0" stroke-width="2"/>
  <text x="840" y="920" fill="#1E1B16" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700">按平台进入</text>
  <text x="840" y="947" fill="#6A5D4D" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16">我就是做 Amazon / Shopify / TikTok Shop / 独立站</text>

  <rect x="1156" y="882" width="320" height="64" rx="16" fill="#F4EEE4" stroke="#D7C7B0" stroke-width="2"/>
  <text x="1184" y="920" fill="#1E1B16" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700">按方法进入</text>
  <text x="1184" y="947" fill="#6A5D4D" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16">我还没想清楚，先看专题和运营方法</text>

  <rect x="88" y="1028" width="1424" height="692" rx="28" fill="#FFFDFC" stroke="#D8CCBA" stroke-width="3"/>
  <text x="124" y="1086" fill="#9E6B1E" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700">内容分区保留，但每个区块都要解释“适合谁点”</text>

  <rect x="124" y="1132" width="644" height="236" rx="22" fill="#FBF8F1" stroke="#DDD0BF" stroke-width="2"/>
  <text x="160" y="1182" fill="#1E1B16" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">核心分类</text>
  <text x="160" y="1224" fill="#5F5446" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19">适合已经知道自己要解决什么问题的人，从需求切入最快。</text>
  <rect x="160" y="1260" width="160" height="44" rx="12" fill="#EFE6D8"/>
  <text x="192" y="1288" fill="#453A2D" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">物流</text>
  <rect x="336" y="1260" width="160" height="44" rx="12" fill="#EFE6D8"/>
  <text x="368" y="1288" fill="#453A2D" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">支付</text>
  <rect x="512" y="1260" width="160" height="44" rx="12" fill="#EFE6D8"/>
  <text x="544" y="1288" fill="#453A2D" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">建站</text>
  <rect x="160" y="1322" width="160" height="44" rx="12" fill="#EFE6D8"/>
  <text x="192" y="1350" fill="#453A2D" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">选品</text>
  <rect x="336" y="1322" width="160" height="44" rx="12" fill="#EFE6D8"/>
  <text x="368" y="1350" fill="#453A2D" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">AI 工具</text>
  <rect x="512" y="1322" width="160" height="44" rx="12" fill="#EFE6D8"/>
  <text x="544" y="1350" fill="#453A2D" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">合规</text>

  <rect x="824" y="1132" width="652" height="236" rx="22" fill="#FBF8F1" stroke="#DDD0BF" stroke-width="2"/>
  <text x="860" y="1182" fill="#1E1B16" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">重点市场 / 平台</text>
  <text x="860" y="1224" fill="#5F5446" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19">适合已经知道自己主战场在哪的人，按国家或平台缩小范围。</text>
  <rect x="860" y="1260" width="120" height="44" rx="12" fill="#EFE6D8"/>
  <text x="896" y="1288" fill="#453A2D" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">美国</text>
  <rect x="996" y="1260" width="120" height="44" rx="12" fill="#EFE6D8"/>
  <text x="1032" y="1288" fill="#453A2D" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">欧洲</text>
  <rect x="1132" y="1260" width="120" height="44" rx="12" fill="#EFE6D8"/>
  <text x="1166" y="1288" fill="#453A2D" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">Amazon</text>
  <rect x="1268" y="1260" width="160" height="44" rx="12" fill="#EFE6D8"/>
  <text x="1302" y="1288" fill="#453A2D" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">Shopify</text>
  <rect x="860" y="1322" width="172" height="44" rx="12" fill="#EFE6D8"/>
  <text x="896" y="1350" fill="#453A2D" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">TikTok Shop</text>
  <rect x="1048" y="1322" width="172" height="44" rx="12" fill="#EFE6D8"/>
  <text x="1088" y="1350" fill="#453A2D" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">独立站</text>

  <rect x="124" y="1402" width="644" height="266" rx="22" fill="#FBF8F1" stroke="#DDD0BF" stroke-width="2"/>
  <text x="160" y="1452" fill="#1E1B16" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">运营专题</text>
  <text x="160" y="1494" fill="#5F5446" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19">适合还在建立认知的人，用专题解释打法、经验与常见问题。</text>
  <rect x="160" y="1536" width="572" height="48" rx="14" fill="#F0E7D8"/>
  <text x="188" y="1567" fill="#453A2D" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">Amazon 卖家工具栈怎么搭</text>
  <rect x="160" y="1600" width="572" height="48" rx="14" fill="#F0E7D8"/>
  <text x="188" y="1631" fill="#453A2D" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">独立站起步应该先选什么服务</text>

  <rect x="824" y="1402" width="652" height="266" rx="22" fill="#FBF8F1" stroke="#DDD0BF" stroke-width="2"/>
  <text x="860" y="1452" fill="#1E1B16" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">投稿入口</text>
  <text x="860" y="1494" fill="#5F5446" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19">对访客来说，这里应该是“提交优质站点”，而不是解释系统如何创建 Issue。</text>
  <rect x="860" y="1540" width="240" height="54" rx="27" fill="#F6F1E8" stroke="#D6C6AE" stroke-width="2"/>
  <text x="914" y="1574" fill="#2A241B" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700">提交新站点</text>
  <text x="860" y="1624" fill="#7E6B52" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">文案重点：收录方向、审核方式、适合提交什么内容。</text>

  <rect x="88" y="1764" width="1424" height="246" rx="28" fill="#FFF7E8" stroke="#E4C58A" stroke-width="3"/>
  <text x="124" y="1822" fill="#9E6B1E" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700">你看这张示意图时，重点关注 3 个判断</text>
  <text x="124" y="1874" fill="#3E3328" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22">1. 首屏是否已经明确告诉用户“这个站是给谁用的”</text>
  <text x="124" y="1912" fill="#3E3328" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22">2. 用户是否能区分“分类 / 市场 / 平台 / 专题”四种入口的差异</text>
  <text x="124" y="1950" fill="#3E3328" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22">3. 首页是否像成熟站点一样先讲使用路径，再展示内容模块</text>
</svg>
